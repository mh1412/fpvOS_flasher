name: pages

# Tests every push to main and every pull request. Publishes the commit the
# `live` tag points to (index.html, its modules and fonts; not the tests) to
# GitHub Pages, which serves it over https as Web Serial needs, so main can
# move on without changing the page. To publish a commit:
#   git tag -f live <commit> && git push -f origin live
# A tag push runs this file as it is in the tagged commit: a commit without
# the `live` trigger (an older one, a fork's pull request) is published by hand:
#   gh workflow run pages.yml --ref main
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions;
# Settings > Environments > github-pages > Deployment branches and tags: main and
# the tag `live`.

on:
  push:
    branches: [main]
    tags: [live]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    # a run by hand publishes `live` as it is: its tests may differ from main's
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/test.mjs test/archive.test.mjs

  deploy:
    # a push of `live` once its tests pass, or a run by hand (test skipped)
    if: ${{ !failure() && !cancelled() && (github.ref == 'refs/tags/live' || github.event_name == 'workflow_dispatch') }}
    needs: test
    runs-on: ubuntu-24.04
    # one deploy at a time; a newer push waits rather than cutting one short
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/live
      - name: Site
        # every tracked file but the tests, docs and repository files, so the
        # step fits whatever layout the tagged commit has
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          cd _site
          rm -rf .github test docs .gitignore .gitattributes README.md LICENSE
          find . -name '*.mjs' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

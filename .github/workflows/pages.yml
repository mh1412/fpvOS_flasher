name: pages

# Tests, then publishes the page (index.html, application modules and fonts;
# not the tests) to GitHub Pages, which serves it over https as Web Serial needs.
# Staging site: deploy pushes to staging after the checks pass.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches: [staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/test.mjs test/archive.test.mjs test/profiles.test.mjs test/unlock.test.mjs test/fpvos.test.mjs test/bootstrap.test.mjs test/p1-bootstrap.test.mjs
      - name: P1 recovery image
        run: |
          python3 tools/package-p1-recovery.py --check
      - name: Browser integration (simulated devices)
        run: node test/browser-check.mjs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    # one deploy at a time; a newer push waits rather than cutting one short
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site
        run: |
          mkdir -p _site/transports _site/assets/ar9311-updater
          cp index.html *.js _site/
          cp -r devices stages fonts _site/
          cp -r assets/ar9311-updater/2026.10.31-ascent-vrx.1 _site/assets/ar9311-updater/
          cp assets/ar9311-updater/COPYING assets/ar9311-updater/README.md _site/assets/ar9311-updater/
          cp -r assets/p1-updater _site/assets/
          cp transports/*.js _site/transports/
      - name: Verify bundled updater source is public
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen

          for path in sorted(Path('_site/assets').glob('*-updater/*/manifest.json')):
              manifest = json.loads(path.read_text())
              repository = manifest['source'].removeprefix('https://github.com/')
              commit = manifest['source_commit']
              url = f'https://api.github.com/repos/{repository}/commits/{commit}'
              try:
                  with urlopen(url, timeout=30) as response:
                      assert json.load(response)['sha'] == commit
              except Exception as error:
                  raise SystemExit(f'::error::{path}: publish the corresponding source commit {commit} at {manifest["source"]} before deploying updater binaries ({error}).')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

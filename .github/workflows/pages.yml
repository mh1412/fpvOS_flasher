name: pages

# Tests every push to main and every pull request. Publishes to GitHub Pages,
# which serves it over https as Web Serial needs, the commit the `live` tag
# points to at the root, and the commit the `preview` tag points to at
# /preview/ (index.html, application modules, assets and fonts; not the tests).
# main moves on without changing either page. Every deploy rebuilds both, so a
# push of one tag keeps the other; deleting `preview` takes /preview/ down.
#   git tag -f live <commit> && git push -f origin live
#   git tag -f preview <commit> && git push -f origin preview
#   git push origin --delete preview
# A tag push runs this file as it is in the tagged commit: a commit without
# these triggers (an older one, a fork's pull request) is published by hand:
#   gh workflow run pages.yml --ref main
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions;
# Settings > Environments > github-pages > Deployment branches and tags: main and
# the tags `live` and `preview`.

on:
  push:
    branches: [main]
    tags: [live, preview]
  pull_request:
  workflow_dispatch:
  delete:

permissions:
  contents: read

jobs:
  test:
    # a run by hand or a tag deletion publishes the tags as they are: their
    # tests may differ from main's
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/test.mjs test/archive.test.mjs test/profiles.test.mjs test/unlock.test.mjs test/fpvos.test.mjs test/bootstrap.test.mjs test/p1-bootstrap.test.mjs
      - name: P1 recovery image
        run: |
          python3 tools/package-p1-recovery.py --check
      - name: Browser integration (simulated devices)
        run: node test/browser-check.mjs

  deploy:
    # a push of `live` or `preview` once its tests pass, a run by hand, or the
    # deletion of `preview` (test skipped)
    if: ${{ !failure() && !cancelled() && (github.ref == 'refs/tags/live' || github.ref == 'refs/tags/preview' || github.event_name == 'workflow_dispatch' || (github.event_name == 'delete' && github.event.ref_type == 'tag' && github.event.ref == 'preview')) }}
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    # one deploy at a time; a newer push waits rather than cutting one short
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every tag, so live and preview are both at hand
      - name: Site
        # every tracked file of each tagged commit but the tests, docs, tools and
        # repository files, so the step fits whatever layout that commit has; a
        # commit carrying tools/version-site.py gets per-commit module URLs
        run: |
          publish() {   # ref, directory
            mkdir -p "$2"
            git archive "$1" | tar -x -C "$2"
            (cd "$2" && rm -rf .github test docs tools .gitignore .gitattributes README.md LICENSE \
              && find . -name '*.mjs' -delete)
            if git cat-file -e "$1:tools/version-site.py" 2>/dev/null; then
              git show "$1:tools/version-site.py" > "$RUNNER_TEMP/version-site.py"
              python3 "$RUNNER_TEMP/version-site.py" "$2" "$(git rev-parse "$1^{commit}")"
            fi
          }
          publish refs/tags/live _site
          if git rev-parse -q --verify refs/tags/preview >/dev/null; then
            publish refs/tags/preview _site/preview
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
